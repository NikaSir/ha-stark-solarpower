name: Frontend bundle

on:
  push:
    branches:
      - "hardening/self-contained-frontend-*"
    paths:
      - "custom_components/stark_solarpower/frontend/**"
      - "custom_components/stark_solarpower/panel.py"
      - "custom_components/stark_solarpower/panel_manifest.json"
      - "scripts/build_frontend_bundle.py"
      - ".github/workflows/frontend-bundle.yml"
  pull_request:
    paths:
      - "custom_components/stark_solarpower/frontend/**"
      - "custom_components/stark_solarpower/panel.py"
      - "custom_components/stark_solarpower/panel_manifest.json"
      - "scripts/build_frontend_bundle.py"
      - ".github/workflows/frontend-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify deterministic panel bundle
        run: python scripts/build_frontend_bundle.py --check

      - name: Verify JavaScript syntax
        run: node --check custom_components/stark_solarpower/frontend/stark-solarpower-panel-bundle.js

      - name: Reject runtime imports in production bundle
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(import|export)[[:space:]]' custom_components/stark_solarpower/frontend/stark-solarpower-panel-bundle.js; then
            echo "Production panel bundle must be self-contained."
            exit 1
          fi

      - name: Verify production module registration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          panel = Path('custom_components/stark_solarpower/panel.py').read_text(encoding='utf-8')
          manifest = json.loads(Path('custom_components/stark_solarpower/panel_manifest.json').read_text(encoding='utf-8'))

          expected = 'stark-solarpower-panel-bundle.js'
          if f'PANEL_BUNDLE = "{expected}"' not in panel:
              raise SystemExit('panel.py must declare the self-contained production bundle')
          if 'module_url=f"{PANEL_STATIC_URL}/{PANEL_BUNDLE}?v={PANEL_UI_VERSION}"' not in panel:
              raise SystemExit('module_url must point to PANEL_BUNDLE with query-string cache busting')
          delivery = manifest.get('frontend_delivery', {})
          if delivery.get('mode') != 'self_contained_bundle':
              raise SystemExit('panel_manifest.json must declare self_contained_bundle delivery')
          if delivery.get('module') != expected:
              raise SystemExit('panel_manifest.json module does not match production registration')
          if delivery.get('runtime_previous_version_imports') is not False:
              raise SystemExit('runtime_previous_version_imports must be false')
          print('Production frontend registration contract OK')
          PY

      - name: Verify committed bundle on pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BUNDLE=custom_components/stark_solarpower/frontend/stark-solarpower-panel-bundle.js
          if git ls-files --error-unmatch "$BUNDLE" >/dev/null 2>&1; then
            git diff --exit-code -- "$BUNDLE"
          else
            echo "Bundle bootstrap: generated artifact will be committed by the hardening-branch push workflow after this build infrastructure reaches main."
          fi

      - name: Commit generated bundle on hardening branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          BUNDLE=custom_components/stark_solarpower/frontend/stark-solarpower-panel-bundle.js
          if git diff --quiet -- "$BUNDLE" && git ls-files --error-unmatch "$BUNDLE" >/dev/null 2>&1; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BUNDLE"
          git commit -m "build: refresh self-contained Stark panel bundle"
          git push origin HEAD:"$GITHUB_REF_NAME"
